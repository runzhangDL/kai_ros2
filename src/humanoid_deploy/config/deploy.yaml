# =============================================================================
# Deployment configuration for the standing policy.
#
# Safety-relevant defaults are deliberately conservative. Raise them only after
# the robot has stood successfully on a gantry, one change at a time.
# =============================================================================

/humanoid_servo:
  ros__parameters:
    # ---- policy bundle -----------------------------------------------------
    # Produced by tools/export_policy.py from stand_params.pkl + robot.xml.
    # It carries the weights, the normalizer, the MuJoCo joint ORDER, the XML
    # joint limits and the action scale, so none of those can drift from what
    # was trained.
    bundle: ""          # set by the launch file

    # ---- bus ---------------------------------------------------------------
    port: /dev/ttyTHS1
    # Raised from 250000 after all 13 servos were re-bauded. Must match
    # humanoid_calibration's joint_limits.yaml, and must have passed
    #   python3 tools/sts_tool.py --baud 500000 bustest 1,...,13
    # at 100% on this robot's cabling before it is trusted.
    baudrate: 500000
    timeout_ms: 30

    # ---- control rate ------------------------------------------------------
    # 0.0 = run at the rate recorded in the bundle, which is the rate the
    # policy was trained at. The current policies were trained at 25 Hz to
    # match the bus AT 250000 BAUD: bus_benchmark reported a 24 ms read+write
    # cycle with a p99 of 28 ms (a 35.7 Hz ceiling), so 25 Hz (40 ms) left
    # 12 ms of headroom for retries and jitter.
    #
    # BOTH OF THOSE NUMBERS ARE NOW OBSOLETE. The 24 ms was never airtime and
    # never per-servo turnaround: it was tcdrain(), a flat ~11.95 ms per
    # transmit in the Tegra UART driver, paid twice a cycle. servo_bus no
    # longer calls it -- the echo it already waits for is a stronger barrier.
    # Measured after that change, 500 cycles, 13 servos at 500000 baud:
    #   cycle p50 5.07 ms, p99 6.58 ms, 100% read success -> ceiling 152 Hz
    # Re-measure after any bus change:
    #   ros2 run humanoid_deploy bus_benchmark --baud 500000
    # Raising the rate also requires RETRAINING: one policy step must equal one
    # physical timestep or every joint velocity in the observation is scaled
    # wrong. Leaving this at 0.0 keeps deployment pinned to whatever the bundle
    # was trained at, which stays correct no matter what the bus can do.
    control_rate_hz: 0.0

    # ---- START HERE --------------------------------------------------------
    # true: the entire loop runs, everything is published and logged, and not
    # one byte is written to a servo. Verify the joint map, the IMU numbers and
    # the arming preflight here before you ever set this false.
    dry_run: true

    # ---- IMU ---------------------------------------------------------------
    imu_topic: /imu/data
    # The wit_ros2_imu driver publishes acceleration in g (it scales by
    # 16/32768) despite the field being defined as m/s^2. 'auto' measures a
    # resting sample and decides; it refuses to run if the answer is neither.
    accel_units: auto
    # That same driver already calls np.radians on the gyro, so this is rad/s.
    gyro_units: rad/s
    # complementary | accel | quaternion -- see imu.py. 'complementary' is the
    # only one that stays correct during a push.
    gravity_source: complementary

    # ---- safety ------------------------------------------------------------
    limit_margin_deg: 2.0        # shrink the calibrated envelope by this much
    ramp_s: 3.0                  # blend from the current pose into the policy
    ramp_joint_rate: 1.0         # rad/s while ramping
    # rad/s once running. Rolled out in MuJoCo, this policy asks for under
    # 0.6 rad/s while standing quietly and up to 18 rad/s for a few cycles
    # while recovering from a shove -- far more than an STS3215 can deliver
    # (~4.7 rad/s unloaded), so the hardware is the real limit and this is a
    # backstop that only bites during a recovery.
    max_joint_rate: 4.0
    arm_tilt_deg: 12.0           # must be this upright to arm
    # How far a joint may already be outside its envelope and still be armed
    # from. The left knee hyperextends ~3.5 deg past the model's zero, so
    # standing on it the leg rests outside and hand-positioning cannot fix it.
    # Commands are still clamped; only the STARTING pose gets this slack, and
    # the ramp pulls the joint inward on the first cycle.
    arm_pose_tolerance_deg: 5.0
    fall_tilt_deg: 40.0          # sustained tilt beyond this = FALL
    command_timeout_s: 0.20      # stale policy command = fault (5 cycles)
    ood_sigma: 6.0               # per-element z-score bound at arm time
    max_temperature_c: 65
    min_voltage_v: 9.5
    # Stall guard. The policy commands the knees and the right hip roll to
    # their calibrated endpoint on most cycles -- in MuJoCo it then tracks to
    # within 0.4 deg, so a joint sitting 15 deg off its command for 2 s is
    # jammed, mis-calibrated or unpowered, not busy.
    stall_error_deg: 15.0
    stall_persist_s: 2.0
    shutdown_on_fault: false     # false keeps the node alive to REPORT the
                                 # fault; torque is off and latched either way

    # ---- servo behaviour ---------------------------------------------------
    # Written once at arm time (RAM registers, they persist). Goal speed 0 would
    # mean "as fast as possible", which is not what you want on a leg.
    #
    # 2000 counts/s (3.07 rad/s) is deliberately conservative and is plenty for
    # standing, which needs under 0.6 rad/s. It is NOT enough for push recovery
    # -- the policy asks for ~9 rad/s there. Raise it toward 3000 only after
    # the robot has stood quietly on a gantry, and expect it to move faster.
    servo_goal_speed: 2000       # counts/s (~176 deg/s)
    # Acc is in units of 100 counts/s^2, so this is 10000 counts/s^2. Measured
    # on the robot with tools/servo_step.py: the hip can only produce about
    # 4300 counts/s^2 (6.6 rad/s^2) against the leg's inertia, so anything
    # above ~50 here is not the binding constraint. The old default of 30
    # (3000 counts/s^2) WAS binding, and throttled every run: 59 deg/s instead
    # of 73 on a 15 deg step, with a 25% longer rise time.
    servo_acc: 100
    # 0.0 = no extra filter. At 25 Hz one encoder count over one cycle is
    # 0.038 rad/s, i.e. 1-5% of the training sigma on every qvel channel, so
    # there is nothing worth filtering and a filter would only add lag.
    velocity_filter_tau: 0.0
    health_check_period_cycles: 10   # one servo's temp/voltage every 0.4 s

/humanoid_policy:
  ros__parameters:
    bundle: ""          # set by the launch file
    imu_topic: /imu/data
    accel_units: auto
    gyro_units: rad/s
    gravity_source: complementary
    complementary_tau: 1.0
    warn_ood_sigma: 8.0
